version: "3.9"

services:
  mongodb:
    image: mongo:7.0
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      MONGO_INITDB_DATABASE: interviews
    command: ["mongod", "--replSet", "rs0", "--bind_ip_all"]
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongo-init:
    image: mongo:7.0
    depends_on:
      mongodb:
        condition: service_healthy
    restart: "no"
    command: >
      mongosh --host mongodb:27017 --eval
      "try { rs.status() } catch(e) { rs.initiate({_id:'rs0', members:[{_id:0, host:'mongodb:27017'}]}) }"

  tts:
    build: .
    env_file:
      - .env
    environment:
      # Override .env values with container-internal addresses
      MONGODB_URI: mongodb://mongodb:27017/?replicaSet=rs0
      MONGODB_DB: interviews
      TRANSCRIPTS_COLLECTION: transcripts
      # NATS is optional — remove or leave empty to disable interrupt feature
      NATS_URI: ""
      # Audio: blank = system default; set to device ID for specific output
      AUDIO_DEVICE_ID: ""
    depends_on:
      mongodb:
        condition: service_healthy
    # For Linux audio output via PulseAudio:
    # volumes:
    #   - /run/user/1000/pulse:/run/pulse
    # environment:
    #   PULSE_SERVER: unix:/run/pulse/native

volumes:
  mongo_data:
